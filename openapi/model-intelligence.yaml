        '405':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /iw/v1/model-intelligence/costs:
    get:
      operationId: getModelIntelligenceCosts
      summary: 'Read operator model intelligence: costs'
      security:
      - RustAdmin: []
      parameters:
      - $ref: '#/components/parameters/start'
      - $ref: '#/components/parameters/end'
      - $ref: '#/components/parameters/bucket_seconds'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/scope'
      - $ref: '#/components/parameters/series_metric'
      - $ref: '#/components/parameters/model_id'
      - $ref: '#/components/parameters/gateway_id'
      responses:
        '200':
          $ref: '#/components/responses/Report'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /console/api/model-intelligence/report:
    get:
      operationId: getConsoleModelIntelligenceReport
      summary: Existing Go operator-only adapter to Rust summary
      description: 'Requires the existing operator middleware: operator-authorized iw_session cookie OR the exact
        configured registration secret. Configured Rust origin and admin token file supply upstream authority; no
        browser identity/bearer/tenant headers are forwarded. No user or private tenant grant exists. Query size
        <=32 KiB; series_metric <=128 lowercase ASCII letters/digits/underscore; cursor <=1024 bytes. Nonoperators
        never receive a report. The adapter preserves the Rust report, uses a 10s deadline, no redirects/cookie
        jar, HTTPS or loopback HTTP, and a 2MiB response limit.'
      security:
      - ConsoleOperator: []
      - ConsoleRegistration: []
      parameters:
      - $ref: '#/components/parameters/start'
      - $ref: '#/components/parameters/end'
      - $ref: '#/components/parameters/bucket_seconds'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/scope'
      - $ref: '#/components/parameters/series_metric'
      - $ref: '#/components/parameters/model_id'
      - $ref: '#/components/parameters/gateway_id'
      responses:
        '200':
          $ref: '#/components/responses/Report'
        '400':
          description: Invalid or unsupported query, including tenant/user filters.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Console authentication required.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Existing session lacks operator permission.
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: Configured Rust source refused, unavailable or invalid; no substitute metrics.
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Browser sign-in is not configured and no valid registration secret was supplied.
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    RustAdmin:
      type: apiKey
      in: header
      name: X-Inferweave-Admin
      description: Existing configured Rust administration secret. Distinct from inference client/worker bearer
        credentials; TLS required except authorized loopback development.
    ConsoleOperator:
      type: apiKey
      in: cookie
      name: iw_session
      description: Existing gateway authenticated session plus operator middleware authorization; an arbitrary cookie
        or regular user session is insufficient.
    ConsoleRegistration:
      type: http
      scheme: bearer
      description: 'Existing Go operator middleware alternative: the exact configured registration secret, compared
        in constant time. Not an inference/client/worker bearer token and never forwarded upstream. No new authentication
        path is introduced.'
  parameters:
    start:
      name: start
      in: query
      required: false
      description: Inclusive Unix milliseconds. Rust defaults to as_of minus one hour. Window must be positive and
        at most 30 days.
      schema:
        type: integer
        minimum: 0
        maximum: 18446744073709551615
        format: uint64
    end:
      name: end
      in: query
      required: false
      description: Exclusive Unix milliseconds, at or before as_of. Defaults to as_of.
      schema:
        type: integer
        minimum: 0
        maximum: 18446744073709551615
        format: uint64
    bucket_seconds:
      name: bucket_seconds
      in: query
      required: false
      description: Requested bucket width. Effective width may increase to keep at most 400 model/bucket pairs per
        page.
      schema:
        type: integer
        minimum: 1
        default: 3600
    limit:
      name: limit
      in: query
      required: false
      description: Requested model limit; effective limit capped at 20 and may shrink further for response size.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    cursor:
      name: cursor
      in: query
      required: false
      description: Decimal model offset. Keep window, filters and series_metric unchanged across pages; no unbounded
        automatic traversal.
      schema:
        type: string
        pattern: ^[0-9]+$
    scope:
      name: scope
      in: query
      required: false
      description: Both labels require the same authenticated Rust operator fleet authority. shared never grants
        anonymous, user or tenant access.
      schema:
        type: string
        enum:
        - operator
        - shared
    series_metric:
      name: series_metric
      in: query
      required: false
      description: Must name an actual full-report metrics key. Each bucket includes only this metric; pooled full-window
        metrics remain complete.
      schema:
        type: string
        default: ttft_ms_p95
    model_id:
      name: model_id
      in: query
      required: false
      description: Repeat model_id once per selected model.
      schema:
        type: array
        maxItems: 200
        items:
          type: string
          minLength: 1
          maxLength: 512
      style: form
      explode: true
    gateway_id:
      name: gateway_id
      in: query
      required: false
      description: Repeat gateway_id once per selected source gateway; legacy unattributed facts remain unknown.
      schema:
        type: array
        maxItems: 200
        items:
          type: string
          minLength: 1
          maxLength: 512
      style: form
      explode: true
  responses:
    Report:
      description: 'Bounded measured/partial/unknown report or explicit unsupported capability. Cache-Control: no-store.'
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Report'
    Error:
      description: Content-free error code; never provider content or credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    TimeWindow:
      type: object
      required:
      - start_inclusive
      - end_exclusive
      properties:
        start_inclusive:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
        end_exclusive:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
    MetricValue:
      type: object
      required:
      - value
      - unit
      - numerator
      - denominator
      - sample_count
      - eligible_count
      - observed_count
      - status
      - unknown_reason
      - source
      - metric_definition_version
      - cohort
      - window
      - as_of
      - last_observed_at
      - confidence
      properties:
        value:
          type: number
          format: double
          nullable: true
        unit:
          type: string
        numerator:
          type: number
          format: double
          nullable: true
        denominator:
          type: number
          format: double
          nullable: true
        sample_count:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
        eligible_count:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
        observed_count:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
        status:
          $ref: '#/components/schemas/MeasurementStatus'
        unknown_reason:
          type: string
          nullable: true
        source:
          type: string
        metric_definition_version:
          type: string
        cohort:
          type: string
        window:
          $ref: '#/components/schemas/TimeWindow'
        as_of:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
        last_observed_at:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
          nullable: true
        confidence:
          type: number
          format: double
          nullable: true
    Incident:
      type: object
      required:
      - occurred_at
      - failure_chain
      - deployment_id
      - worker_id
      - gpu_ids
      - slurm_job_id
      - affected_logical_requests
      properties:
        occurred_at:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
        failure_chain:
          type: array
          items:
            $ref: '#/components/schemas/FailureCause'
        deployment_id:
          type: string
          nullable: true
        worker_id:
          type: string
          nullable: true
        gpu_ids:
          type: array
          items:
            type: string
        slurm_job_id:
          type: string
          nullable: true
        affected_logical_requests:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
          nullable: true
    TimeBucket:
      type: object
      required:
      - window
      - metrics
      properties:
        window:
          $ref: '#/components/schemas/TimeWindow'
        metrics:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MetricValue'
    ModelReport:
      type: object
      required:
      - model_id
      - metrics
      - incidents
      - incidents_truncated
      - timeseries
      - capacity
      - evaluations
      - candidates
      - costs
      - tokens
      properties:
        model_id:
          type: string
        metrics:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MetricValue'
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
        incidents_truncated:
          type: boolean
        timeseries:
          type: array
          items:
            $ref: '#/components/schemas/TimeBucket'
        capacity:
          oneOf:
          - $ref: '#/components/schemas/CapacityReport'
          - $ref: '#/components/schemas/MultipleCapacityReports'
          - $ref: '#/components/schemas/UnavailableSection'
        evaluations:
          oneOf:
          - $ref: '#/components/schemas/EvaluationReports'
          - $ref: '#/components/schemas/UnavailableSection'
        candidates:
          oneOf:
          - $ref: '#/components/schemas/EvaluationReports'
          - $ref: '#/components/schemas/UnavailableSection'
        costs:
          oneOf:
          - $ref: '#/components/schemas/Costs'
          - $ref: '#/components/schemas/UnavailableSection'
        tokens:
          $ref: '#/components/schemas/UsageTotals'
      description: Per-model aggregate plus typed economics/capacity/qualification. Detail may be explicitly unavailable
        when evidence is absent or the response-size limit is reached.
    CountAggregate:
      type: object
      required:
      - total
      - known_total
      - reported_samples
      - estimated_samples
      - missing_samples
      - unsupported_samples
      properties:
        total:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
          nullable: true
        known_total:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
        reported_samples:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
        estimated_samples:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
        missing_samples:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
        unsupported_samples:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
      description: total is null if any required observation is unknown or the warehouse cohort is truncated. known_total
        is only the known subtotal. Sample counters preserve reported/estimated/missing/unsupported distinctions.
    CacheHitRatio:
      type: object
      required:
      - value
      - cache_read_numerator
      - input_denominator
      - eligible_samples
      - all_samples
      - estimated_samples
      properties:
        value:
          type: number
          format: double
          nullable: true
        cache_read_numerator:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
        input_denominator:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
        eligible_samples:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
        all_samples:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
        estimated_samples:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
    UsageTotals:
      type: object
      required:
      - samples
      - input_total
      - input_uncached
      - input_cache_read
      - input_cache_write
      - unknown_input
      - output_total
      - output_visible
      - output_reasoning
      - unknown_output
      - overlap_cache_write
      - overlap_output_reasoning
      - cache_hit_ratio
      properties:
        samples:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
        input_total:
          $ref: '#/components/schemas/CountAggregate'
        input_uncached:
          $ref: '#/components/schemas/CountAggregate'
        input_cache_read:
          $ref: '#/components/schemas/CountAggregate'
        input_cache_write:
          $ref: '#/components/schemas/CountAggregate'
        unknown_input:
          $ref: '#/components/schemas/CountAggregate'
        output_total:
          $ref: '#/components/schemas/CountAggregate'
        output_visible:
          $ref: '#/components/schemas/CountAggregate'
        output_reasoning:
          $ref: '#/components/schemas/CountAggregate'
        unknown_output:
          $ref: '#/components/schemas/CountAggregate'
        overlap_cache_write:
          $ref: '#/components/schemas/CountAggregate'
        overlap_output_reasoning:
          $ref: '#/components/schemas/CountAggregate'
        cache_hit_ratio:
          $ref: '#/components/schemas/CacheHitRatio'
      description: Attempt-level physical usage, never implicit logical/billed usage. overlap_cache_write and overlap_output_reasoning
        are annotations outside exclusive stacks; never add them to totals.
    CostResult:
      type: object
      required:
      - metric_definition_version
      - amount_nanos
      - currency
      - status
      - known_subtotal_nanos
      - priced_components
      - total_components
      - rate_ids
      - missing_reasons
      - unattributed_nanos
      properties:
        metric_definition_version:
          type: string
        amount_nanos:
          type: string
          pattern: ^(0|[1-9][0-9]{0,19})$
          description: Exact decimal unsigned u64 nano-currency amount (maximum 18446744073709551615); never a JSON
            number. One unit is 1e-9 of the named currency.
          nullable: true
        currency:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/CostStatus'
        known_subtotal_nanos:
          $ref: '#/components/schemas/NanoCurrency'
        priced_components:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
        total_components:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
        rate_ids:
          type: array
          items:
            type: string
        missing_reasons:
          type: array
          items:
            type: string
        unattributed_nanos:
          type: string
          pattern: ^(0|[1-9][0-9]{0,19})$
          description: Exact decimal unsigned u64 nano-currency amount (maximum 18446744073709551615); never a JSON
            number. One unit is 1e-9 of the named currency.
          nullable: true
      description: Rust CostResult after HTTP redaction removes private allocation subjects. Configured-rate cost
        is not proof of an invoice.
    ProviderRateCard:
      type: object
      required:
      - id
      - provider
      - region
      - model
      - currency
      - effective_from
      - effective_until
      - min_context
      - max_context
      - input_uncached
      - output
      - cache_read
      - cache_write
      - reasoning
      properties:
        id:
          type: string
        provider:
          type: string
        region:
          type: string
        model:
          type: string
        currency:
          type: string
        effective_from:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
        effective_until:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
          nullable: true
        min_context:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
        max_context:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
          nullable: true
        input_uncached:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
          format: uint64
