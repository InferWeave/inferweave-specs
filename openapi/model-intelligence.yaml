  /iw/v1/model-intelligence/candidates:
    get:
      operationId: getModelIntelligenceCandidates
      summary: 'Read operator model intelligence: candidates'
      security:
      - RustAdmin: []
      parameters:
      - $ref: '#/components/parameters/start'
      - $ref: '#/components/parameters/end'
      - $ref: '#/components/parameters/bucket_seconds'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/scope'
      - $ref: '#/components/parameters/series_metric'
      - $ref: '#/components/parameters/model_id'
      - $ref: '#/components/parameters/gateway_id'
      responses:
        '200':
          $ref: '#/components/responses/Report'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
