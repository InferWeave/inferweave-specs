openapi: 3.0.3
info:
  title: InferWeave Model Intelligence Read API
  version: 1.0.0
  description: Additive spec 58 API, pinned to Rust integration 35ac81e7b0a0c3cba23390c1adae092ea392ca0d. Independent
    of Protocol v1 /inferweave/v1 base path. All eight Rust routes are authenticated read-only operator reports.
    Unknown/duplicate scalar parameters, tenant/user filters and GET bodies are rejected. Headers never manufacture
    grants. See model-intelligence.md for current capability gaps and evidence.
servers:
- url: /
paths:
  /iw/v1/model-intelligence/summary:
    get:
      operationId: getModelIntelligenceSummary
      summary: 'Read operator model intelligence: summary'
      security:
      - RustAdmin: []
      parameters:
      - $ref: '#/components/parameters/start'
      - $ref: '#/components/parameters/end'
      - $ref: '#/components/parameters/bucket_seconds'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/scope'
      - $ref: '#/components/parameters/series_metric'
      - $ref: '#/components/parameters/model_id'
      - $ref: '#/components/parameters/gateway_id'
      responses:
        '200':
          $ref: '#/components/responses/Report'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /iw/v1/model-intelligence/timeseries:
