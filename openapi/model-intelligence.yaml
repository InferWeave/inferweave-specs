        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /iw/v1/model-intelligence/incidents:
    get:
      operationId: getModelIntelligenceIncidents
      summary: 'Read operator model intelligence: incidents'
      security:
      - RustAdmin: []
      parameters:
      - $ref: '#/components/parameters/start'
