  /iw/v1/model-intelligence/capacity:
    get:
      operationId: getModelIntelligenceCapacity
      summary: 'Read operator model intelligence: capacity'
      security:
      - RustAdmin: []
      parameters:
      - $ref: '#/components/parameters/start'
      - $ref: '#/components/parameters/end'
      - $ref: '#/components/parameters/bucket_seconds'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/scope'
