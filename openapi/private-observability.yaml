openapi: 3.1.0
info:
  title: InferWeave private normalized observability HTTP
  version: 1.0.0
  description: Default-disabled internal API. Single-event ingest uses existing current
    gateway-node credentials; reads use existing operator admin authority. See private-observability.md.
    Schema/fixture proof does not enable production collection or public output.
servers:
- url: /
paths:
  /iw/v1/observability/events:
    post:
      operationId: ingestPrivateObservation
      description: 64 KiB body bound must be enforced from the HTTP head and while
        reading before generic 16 MiB allocation. No batch, compression, query parameters,
        client server clock, coverage or public grants. 201/200 only after durable
        validation/identity and window checks.
      security:
      - NodeBearer: []
        NodeIdentity: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/events/request-observation.json
      responses:
        '201':
          description: Durably accepted immutable event.
          headers: &id001
            Cache-Control: &id002
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/observability/ingest-result.json
        '200':
          description: Identical durable replay, no count change.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/observability/ingest-result.json
        '429': &id005
          description: BUSY
          headers:
            Cache-Control: *id002
            Retry-After:
              description: Required integer delta seconds, same value as retry_after_seconds.
              schema:
                type: integer
                minimum: 1
                maximum: 60
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/observability/error.json
        '400': &id006
          description: INVALID_REQUEST
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/observability/error.json
        '401': &id007
          description: UNAUTHENTICATED
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/observability/error.json
        '403': &id008
          description: FORBIDDEN
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/observability/error.json
        '404': &id009
          description: FEATURE_DISABLED
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/observability/error.json
        '405': &id010
          description: METHOD_NOT_ALLOWED
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/observability/error.json
        '503': &id011
          description: UNAVAILABLE
          headers:
            Cache-Control: *id002
            Retry-After:
              description: Required integer delta seconds, same value as retry_after_seconds.
              schema:
                type: integer
                minimum: 1
                maximum: 60
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/observability/error.json
        '409': &id012
          description: REPLAY_CONFLICT/WINDOW_SEALED
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/observability/error.json
        '410': &id013
          description: WINDOW_EXPIRED/CURSOR_EXPIRED
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/observability/error.json
        '413': &id014
          description: PAYLOAD_TOO_LARGE
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/observability/error.json
        '415': &id015
          description: UNSUPPORTED_MEDIA_TYPE
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/observability/error.json
  /iw/v1/observability/rollups:
    get:
      operationId: getPrivateObservationRollups
      description: Operator-only exact internal dimensions; no GET body. Required
        bounded UTC half-open window; snapshot-bound cursor pins original query and
        revisions. Unknown/duplicate query parameters rejected. Empty rows never establish
        capture completeness.
      security:
      - AdminHeader: []
      - AdminBearer: []
      parameters:
      - &id016
        name: start
        in: query
        required: true
        schema: &id003
          type: string
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
      - &id017
        name: end
        in: query
        required: true
        schema: *id003
      - &id018
        name: source_gateway_id
        in: query
        required: false
        schema: &id004
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[\x21-\x7e]+$
      - &id019
        name: model_id
        in: query
        required: false
        schema: *id004
      - &id020
        name: cluster_id
        in: query
        required: false
        schema: *id004
      - &id021
        name: runtime_instance_id
        in: query
        required: false
        schema: *id004
      - &id022
        name: gpu_resource_id
        in: query
        required: false
        schema: *id004
      - &id023
        name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - &id024
        name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 1024
      - name: resolution_seconds
        in: query
        required: true
        schema:
          type: integer
          enum:
          - 300
          - 3600
          - 86400
      - name: dataset
        in: query
        required: false
        schema:
          type: string
          enum: &id025
          - production
          - controlled
          - unknown
      - name: observation_kind
        in: query
        required: false
        schema:
          type: string
          enum: &id026
          - ingress_terminal
          - attempt_terminal
          - hop_terminal
      - name: lineage_scope
        in: query
        required: false
        schema:
          type: string
          enum: &id027
          - trusted
          - local_unlinked
      responses:
        '200':
          description: Validated snapshot page; explicit query health and unavailable
            failure companions.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/observability/rollups.json
        '429': *id005
        '400': *id006
        '401': *id007
        '403': *id008
        '404': *id009
        '405': *id010
        '503': *id011
        '409': *id012
        '410': *id013
        '413': *id014
        '415': *id015
  /iw/v1/observability/diagnostics:
    get:
      operationId: getPrivateObservationDiagnostics
      description: Operator-only exact internal dimensions; no GET body. Required
        bounded UTC half-open window; snapshot-bound cursor pins original query and
        revisions. Unknown/duplicate query parameters rejected. Empty rows never establish
        capture completeness.
      security:
      - AdminHeader: []
      - AdminBearer: []
      parameters:
      - *id016
      - *id017
      - *id018
      - *id019
      - *id020
      - *id021
      - *id022
      - *id023
      - *id024
      - name: dataset
        in: query
        required: false
        schema:
          type: string
          enum: *id025
      - name: observation_kind
        in: query
        required: false
        schema:
          type: string
          enum: *id026
      - name: lineage_scope
        in: query
        required: false
        schema:
          type: string
          enum: *id027
      responses:
        '200':
          description: Validated snapshot page; explicit query health and unavailable
            failure companions.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/observability/diagnostics.json
        '429': *id005
        '400': *id006
        '401': *id007
        '403': *id008
        '404': *id009
        '405': *id010
        '503': *id011
        '409': *id012
        '410': *id013
        '413': *id014
        '415': *id015
components:
  securitySchemes:
    NodeBearer:
      type: http
      scheme: bearer
      description: Persistent node credential authenticated by NodeControl; current
        registered gateway role required.
    NodeIdentity:
      type: apiKey
      in: header
      name: X-InferWeave-Node
    AdminHeader:
      type: apiKey
      in: header
      name: X-InferWeave-Admin
    AdminBearer:
      type: http
      scheme: bearer
      description: Existing control.is_admin credential; inference keys/service actors
        are insufficient.
