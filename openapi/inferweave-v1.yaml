openapi: 3.0.3
info:
  title: InferWeave Protocol v1
  version: 1.1.0
  description: >-
    Control and observability HTTP surfaces for InferWeave Protocol v1. HTTP + JSON is the
    normative v1 transport; object semantics are transport-independent. Scheduler/runtime/
    deployment agnostic. The OpenAI-compatible data-plane endpoints (e.g. /v1/chat/completions)
    are preserved by implementations per specs/45_PROTOCOL_V1.md but are defined by the OpenAI
    API surface and are not redefined here. See specs/45_PROTOCOL_V1.md.
    Parity: native endpoints observe the same admission, capacity, and fairshare controls as the
    OpenAI-compatible data-plane (specs/49); parity is checked by a shared conformance fixture.
servers:
  - url: /inferweave/v1
paths:
  /protocol:
    get:
      operationId: getProtocol
      summary: Protocol version and supported features
      responses:
        "200":
          description: Protocol version and features
          content:
            application/json:
              schema:
                type: object
                required: [protocol, features]
                properties:
                  protocol: { $ref: "#/components/schemas/Protocol" }
                  features: { type: object, additionalProperties: { type: string } }
  /topology:
    get:
      operationId: getTopology
      summary: Whole-topology snapshot (gateway/node/device/runtime/residency)
      responses:
        "200":
          description: Topology snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Topology" }
  /gateways:
    get:
      operationId: listGateways
      summary: List federated gateways
      responses:
        "200":
          description: Gateway list
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Gateway" } }
  /nodes:
    get:
      operationId: listNodes
      summary: List nodes
      responses:
        "200":
          description: Node list
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Node" } }
  /devices:
    get:
      operationId: listDevices
      summary: List devices and GPU memory accounting
      responses:
        "200":
          description: Device list
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Device" } }
  /runtimes:
    get:
      operationId: listRuntimes
      summary: List runtime instances
      responses:
        "200":
          description: Runtime list; each entry carries a selection_reason explaining why the runtime is the family's route
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RuntimeInstance" } }
  /deployments:
    get:
      operationId: listDeployments
      summary: List deployment manifests with live assignment/instance state (specs/49)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Deployment list; each entry carries a placement_reason for auditability
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Deployment" } }
  /deployments/{deployment_id}:
    get:
      operationId: getDeployment
      summary: Get one deployment manifest and its instance state
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deployment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "404":
          description: Unknown deployment id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /capabilities:
    get:
      operationId: listCapabilities
      summary: Typed capability catalog, filterable by runtime family (specs/48, specs/49)
      parameters:
        - name: family
          in: query
          required: false
          description: Runtime family id; values outside the closed registry are rejected with 400.
          schema:
            type: string
            enum: [llm, reasoning, embeddings, reranking, stt, tts, audio, prediction, image, video, multimodal, scientific, rag]
      responses:
        "200":
          description: Capability catalog
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Capability" } }
        "400":
          description: Unknown family id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /models:
    get:
      operationId: listModels
      summary: List models, variants, and capabilities
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Model" } }
  /aliases:
    get:
      operationId: listAliases
      summary: List aliases
      responses:
        "200":
          description: Alias list
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Alias" } }
  /capacity:
    get:
      operationId: getCapacity
      summary: Structured scheduling capacity
      responses:
        "200":
          description: Capacity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capacity" }
  /health:
    get:
      operationId: getHealth
      summary: Multidimensional health
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
  /events:
    get:
      operationId: streamEvents
      summary: Event stream (SSE or cursor-based) for a source
      parameters:
        - name: source_id
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        "200":
          description: >-
            Event stream. When served as Server-Sent Events each frame is one serialized
            Event object; a cursor-based poll returns a JSON array of Event objects.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/Event" }
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
  /requests/{request_id}/routing:
    get:
      operationId: getRoutingExplanation
      summary: Explain a routing decision
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Routing explanation
          content:
            application/json:
              schema:
                type: object
                properties:
                  requested: { type: object, additionalProperties: true }
                  alias_resolution: { type: object, additionalProperties: true }
                  candidates: { type: array, items: { type: object, additionalProperties: true } }
                  selected: { type: object, additionalProperties: true }
                  fallbacks: { type: array, items: { type: object, additionalProperties: true } }
                  retries: { type: array, items: { type: object, additionalProperties: true } }
  /jobs:
    post:
      operationId: createJob
      summary: Create an async job (durable-job submission surface, specs/51, specs/52)
      description: >-
        The durable-job inference submission surface (specs/52). The request carries either a single
        runtime-family inference request (typed by `family`, specs/48) or a pipeline reference
        (specs/51). Long-running inference is a job, never a held-open request. The lifecycle is
        queued -> running -> succeeded | failed | cancelled with durable progress
        (state-machines/job.md). The response is a job reference; results are returned by reference
        to an artifact in the artifact cache model (schemas/v1/artifacts/), never as an inline
        result body. A durable job observes the same admission, capacity, fairshare, and
        owner-priority controls as synchronous inference and does not bypass them.
      x-durable-job-submission: true
      x-job-contract: schemas/v1/jobs/job.json
      responses:
        "201":
          description: Created job; references the job and its result artifact by reference (no inline result body)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
    get:
      operationId: listJobs
      summary: List async jobs
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Job" } }
  /jobs/{job_id}:
    get:
      operationId: getJob
      summary: Get an async job
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
    delete:
      operationId: cancelJob
      summary: Cancel an async job (idempotent)
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Cancelled
  /gpu-memory:
    get:
      operationId: getGpuMemory
      summary: GPU memory fleet snapshot (iw.gpu-memory.fleet/1, specs/46 §4)
      description: >-
        Served while iw.gpu-memory/1 is in force. The reference implementation serves the same
        document at /iw/v1/gpu-memory beside /iw/v1/topology. Authoritative schema:
        schemas/v1/resources/gpu-memory-fleet.json. Large fleets are paginated (limit, cursor,
        nextCursor, nodeCount; specs/46 §3.7).
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1024 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Fleet snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GpuMemoryFleet" }
        "503":
          description: Every pinned snapshot is still live and maxPinnedSnapshots is reached; retry a new first page after Retry-After
        "410":
          description: The cursor is expired (cursorTtlSecs), unknown, or from before a producer restart; start again from the first page
        "501":
          description: FEATURE_UNSUPPORTED -- the capability is not in force here
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /gpu-memory/events:
    get:
      operationId: listGpuMemoryEvents
      summary: GPU memory, runtime placement and rebalance decision events (specs/46 §7)
      description: >-
        Served while iw.rebalance-decisions/1 is in force. Authoritative schema:
        schemas/v1/events/gpu-memory-event.json.
      parameters:
        - name: after
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: >-
            Events after the cursor, oldest first. A cursor whose producerEpoch differs from the
            server's current epoch means resynchronize from GET /gpu-memory, then resume.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GpuMemoryEvent" }
        "501":
          description: FEATURE_UNSUPPORTED -- the capability is not in force here
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /gpu-memory/simulate:
    post:
      operationId: simulateGpuMemoryPlacement
      summary: Read-only placement simulation from the real rebalancer evaluation (specs/46 §9)
      description: >-
        Served while iw.placement-simulation/1 is in force; never reserves, starts or changes
        anything. Authoritative schemas: schemas/v1/resources/placement-simulation-request.json
        and placement-simulation-response.json.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlacementSimulationRequest" }
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacementSimulationResponse" }
        "501":
          description: FEATURE_UNSUPPORTED -- the capability is not in force here, or this gateway is not a rebalancer authority
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /rerank:
    post:
      operationId: rerank
      summary: Rerank documents against a query (family reranking, specs/49)
      description: >-
        Admitted only when the target runtime advertises the reranking family. A request whose
        family is not reranking is rejected with 400 FAMILY_MISMATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RerankRequest" }
      responses:
        "200":
          description: Ranked results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RerankResponse" }
        "400":
          description: FAMILY_MISMATCH -- the request or target runtime is not the reranking family
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyMismatchError" }
  /predictions:
    post:
      operationId: predict
      summary: Numeric or label predictions (family prediction, specs/49)
      description: >-
        Admitted only when the target runtime advertises the prediction family. A request whose
        family is not prediction is rejected with 400 FAMILY_MISMATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PredictionRequest" }
      responses:
        "200":
          description: Predictions, numeric or label
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PredictionResponse" }
        "400":
          description: FAMILY_MISMATCH -- the request or target runtime is not the prediction family
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyMismatchError" }
  /embeddings:
    post:
      operationId: embed
      summary: Typed embedding vectors (family embeddings, specs/49)
      description: >-
        Admitted only when the target runtime advertises the embeddings family. A request whose
        family is not embeddings is rejected with 400 FAMILY_MISMATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbeddingRequest" }
      responses:
        "200":
          description: Embedding vectors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbeddingResponse" }
        "400":
          description: FAMILY_MISMATCH -- the request or target runtime is not the embeddings family
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyMismatchError" }
  /pipelines:
    post:
      operationId: submitPipeline
      summary: Submit a pipeline definition (specs/51)
      description: >-
        Registers a typed inference pipeline definition. The pipeline DAG contract is referenced,
        not fully defined here; B-T04 fills it in. Returns a Protocol v1 envelope referencing the
        stored pipeline.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineDefinitionRequest" }
      responses:
        "201":
          description: Pipeline accepted; envelope references the pipeline result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineEnvelope" }
  /pipelines/execute:
    post:
      operationId: executePipeline
      summary: Execute a typed inference pipeline (specs/49, specs/51)
      description: >-
        Executes a typed inference pipeline. Returns a Protocol v1 envelope referencing the result;
        long-running executions reference a durable job created through POST /jobs.
        The request carries a pipeline (by pipeline_id or inline definition) whose DAG follows the
        pipeline contract in schemas/v1/pipelines/pipeline.json (PipelineDag). Before execution the
        DAG is validated: it must be acyclic, every dependency must name a stage in the pipeline,
        every stage family must be present in the canonical registry (specs/48) and resolvable to an
        admitted runtime, and stage outputs must match downstream inputs (modality + shape). A
        violation is rejected with 400 and a typed PipelineValidationError. Each stage is admitted
        through the same per-family admission, capacity, and fairshare accounting as the
        corresponding family endpoint; the canonical rag pipeline (CanonicalRagPipeline) is executed
        through this endpoint and has no separate ad-hoc path.
      x-pipeline-contract: schemas/v1/pipelines/pipeline.json
      x-canonical-pipelines:
        rag: { $ref: "#/components/schemas/CanonicalRagPipeline" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineExecuteRequest" }
      responses:
        "200":
          description: Pipeline result; envelope references the result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineEnvelope" }
        "202":
          description: Execution accepted as a durable job; envelope references the job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineEnvelope" }
        "400":
          description: Pipeline DAG validation failed (cycle, unknown dependency, unknown or unadmitted family, or I/O mismatch)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineValidationError" }
components:
  schemas:
    PipelineDefinitionRequest:
      type: object
      required: [name, definition]
      properties:
        name: { type: string }
        definition:
          description: Pipeline DAG; contract defined by B-T04.
          type: object
          additionalProperties: true
    PipelineExecuteRequest:
      type: object
      properties:
        pipeline_id: { type: string }
        definition:
          description: Inline pipeline DAG; validated against the pipeline contract before execution.
          allOf:
            - $ref: "#/components/schemas/PipelineDag"
        inputs: { type: object, additionalProperties: true }
        durable: { type: boolean, description: "When true, execute as a durable job (POST /jobs surface)." }
    PipelineDag:
      description: >-
        Summary; authoritative schema schemas/v1/pipelines/pipeline.json. An acyclic graph of
        runtime-family stages; each stage lists its upstream stage_ids in `dependencies` (DAG edges).
      x-schema: schemas/v1/pipelines/pipeline.json
      type: object
      required: [pipeline_id, stages, inputs]
      properties:
        pipeline_id: { type: string, minLength: 1 }
        stages:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PipelineStage" }
        inputs: { type: object, additionalProperties: { $ref: "#/components/schemas/PipelineTypedIO" } }
    PipelineStage:
      type: object
      required: [stage_id, family, inputs, outputs, dependencies]
      properties:
        stage_id: { type: string, minLength: 1 }
        family:
          type: string
          enum: [llm, reasoning, embeddings, reranking, stt, tts, audio, prediction, image, video, multimodal, scientific, rag]
        runtime_target: { type: string, minLength: 1 }
        fallback_target: { type: string, minLength: 1 }
        inputs: { type: object, additionalProperties: { $ref: "#/components/schemas/PipelineTypedIO" } }
        outputs: { type: object, additionalProperties: { $ref: "#/components/schemas/PipelineTypedIO" } }
        dependencies:
          description: stage_ids this stage depends on (DAG edges).
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
    PipelineTypedIO:
      type: object
      required: [modality]
      additionalProperties: true
      properties:
        modality: { type: string, minLength: 1 }
        shape: { type: array, items: { type: integer } }
    PipelineValidationError:
      description: Typed error (schemas/v1/errors/error.json envelope) for a pipeline DAG that fails validation.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            code: { type: string, enum: [pipeline_cycle, pipeline_unknown_dependency, pipeline_unknown_family, pipeline_io_mismatch] }
            category: { type: string, enum: [protocol] }
            retryable: { type: boolean, enum: [false] }
    CanonicalRagPipeline:
      description: >-
        Canonical rag pipeline (specs/51 "RAG as a pipeline"): an embeddings retrieval stage and a
        reranking stage feeding an llm generation stage, wired by explicit DAG edges. The pipeline
        graph is the single definition of rag; each stage is admitted through the same per-family
        admission, capacity, and fairshare accounting as its family endpoint, and no separate
        ad-hoc RAG path exists.
      allOf:
        - $ref: "#/components/schemas/PipelineDag"
      x-admission-accounting:
        mode: per-stage
        controls: [admission, capacity, fairshare]
        stage-families:
          embeddings: /embeddings
          reranking: /rerank
          llm: /v1/chat/completions
        ad-hoc-path: false
      example:
        pipeline_id: rag
        inputs:
          query: { modality: text }
        stages:
          - stage_id: retrieve
            family: embeddings
            inputs: { query: { modality: text } }
            outputs: { candidates: { modality: documents } }
            dependencies: []
          - stage_id: rerank
            family: reranking
            inputs: { candidates: { modality: documents } }
            outputs: { context: { modality: documents } }
            dependencies: [retrieve]
          - stage_id: generate
            family: llm
            inputs: { context: { modality: documents } }
            outputs: { answer: { modality: text } }
            dependencies: [rerank]
    PipelineEnvelope:
      description: Protocol v1 envelope referencing a pipeline result.
      type: object
      required: [protocol, result]
      properties:
        protocol: { $ref: "#/components/schemas/Protocol" }
        result:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [pipeline, pipeline_run, job] }
            id: { type: string }
            job: { $ref: "#/components/schemas/Job" }
    FamilyMismatchError:
      description: Typed error (schemas/v1/errors/error.json envelope) for a request routed to the wrong family endpoint.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [details]
          properties:
            code: { type: string, enum: [FAMILY_MISMATCH] }
            category: { type: string, enum: [routing] }
            retryable: { type: boolean, enum: [false] }
            details:
              type: object
              required: [expected_family]
              properties:
                expected_family:
                  type: string
                  enum: [reranking, prediction, embeddings]
                requested_family: { type: string }
    RerankRequest:
      x-json-schema: schemas/v1/requests/rerank.json
      type: object
      additionalProperties: true
      required: [family, model, query, documents]
      properties:
        family: { type: string, enum: [reranking] }
        model: { type: string }
        query: { type: string }
        documents: { type: array, minItems: 1, items: { type: string } }
        top_n: { type: integer, minimum: 1 }
    RerankResponse:
      type: object
      required: [family, model, results]
      properties:
        family: { type: string, enum: [reranking] }
        model: { type: string }
        results:
          type: array
          items:
            type: object
            required: [index, relevance_score]
            properties:
              index: { type: integer, minimum: 0 }
              relevance_score: { type: number }
    PredictionRequest:
      x-json-schema: schemas/v1/requests/prediction.json
      type: object
      additionalProperties: true
      required: [family, model, inputs]
      properties:
        family: { type: string, enum: [prediction] }
        model: { type: string }
        inputs: { type: array, minItems: 1, items: { type: object, additionalProperties: true } }
    PredictionResponse:
      type: object
      required: [family, model, predictions]
      properties:
        family: { type: string, enum: [prediction] }
        model: { type: string }
        predictions:
          type: array
          items:
            type: object
            required: [output_type, value]
            properties:
              output_type: { type: string, enum: [numeric, label] }
              value:
                oneOf:
                  - { type: number }
                  - { type: string }
              score: { type: number }
    EmbeddingRequest:
      x-json-schema: schemas/v1/requests/embeddings.json
      type: object
      additionalProperties: true
      required: [family, model, input]
      properties:
        family: { type: string, enum: [embeddings] }
        model: { type: string }
        input: { type: array, minItems: 1, items: { type: string } }
    EmbeddingResponse:
      type: object
      required: [family, model, data]
      properties:
        family: { type: string, enum: [embeddings] }
        model: { type: string }
        data:
          type: array
          items:
            type: object
            required: [index, embedding]
            properties:
              index: { type: integer, minimum: 0 }
              embedding: { type: array, items: { type: number } }
    Capability:
      type: object
      required: [family, input_modalities, output_modalities]
      properties:
        family:
          type: string
          enum: [llm, reasoning, embeddings, reranking, stt, tts, audio, prediction, image, video, multimodal, scientific, rag]
        input_modalities: { type: array, minItems: 1, items: { type: string } }
        output_modalities: { type: array, minItems: 1, items: { type: string } }
        quality: { type: object, additionalProperties: true }
        context: { type: object, nullable: true, additionalProperties: true }
    DeploymentIdentity:
      x-json-schema: schemas/v1/deployments/deployment-identity.json
      type: object
      additionalProperties: false
      required: [schema_version, modality, model, artifacts, runtime, effective_profile, policy, resource_contract]
      properties:
        schema_version: { type: string, const: inferweave.deployment-identity/v1 }
        modality: { type: string, minLength: 1 }
        model: { type: object, minProperties: 1, additionalProperties: true }
        artifacts: { type: array, minItems: 1, items: { type: object, minProperties: 1, additionalProperties: true } }
        runtime: { type: object, minProperties: 1, additionalProperties: true }
        effective_profile: { type: object, minProperties: 1, additionalProperties: true }
        policy: { type: object, additionalProperties: true }
        resource_contract: { type: object, minProperties: 1, additionalProperties: true }
    Deployment:
      x-json-schema: schemas/v1/deployments/deployment.json
      type: object
      additionalProperties: false
      required: [deployment_id, deployment_key, manifest]
      properties:
        deployment_id: { type: string, minLength: 1 }
        deployment_key: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        manifest: { $ref: "#/components/schemas/DeploymentIdentity" }
        live:
          type: object
          additionalProperties: false
          properties:
            instances: { type: array, items: { $ref: "#/components/schemas/RuntimeInstance" } }
            assignment: { $ref: "#/components/schemas/Allocation" }
            placement_reason: { type: string }
    Topology:
      type: object
      required: [generation]
      properties:
        generation: { type: string }
        snapshot_id: { type: string }
        generated_at: { type: string }
        gateways: { type: array, items: { $ref: "#/components/schemas/Gateway" } }
        nodes: { type: array, items: { $ref: "#/components/schemas/Node" } }
        devices: { type: array, items: { $ref: "#/components/schemas/Device" } }
        runtimes: { type: array, items: { $ref: "#/components/schemas/RuntimeInstance" } }
        residencies: { type: array, items: { $ref: "#/components/schemas/Residency" } }
    Protocol:
      type: object
      required: [name, version, minimum_compatible_version]
      properties:
        name: { const: inferweave }
        version: { type: string }
        minimum_compatible_version: { type: string }
    Provenance:
      type: object
      properties:
        origin_gateway_id: { type: string }
        reporting_gateway_id: { type: string }
        federation_path: { type: array, items: { type: string } }
        source: { type: string }
        observed_at: { type: string }
        age_ms: { type: number }
    Gateway:
      type: object
      required: [gateway_id]
      properties:
        gateway_id: { type: string }
        name: { type: string }
        protocol: { $ref: "#/components/schemas/Protocol" }
        features: { type: object, additionalProperties: { type: string } }
        state: { type: string }
        children: { type: array, items: { type: object, additionalProperties: true } }
        provenance: { $ref: "#/components/schemas/Provenance" }
    Node:
      type: object
      required: [node_id]
      properties:
        node_id: { type: string }
        hostname: { type: string }
        state: { type: string }
        allocation: { $ref: "#/components/schemas/Allocation" }
        devices: { type: array, items: { $ref: "#/components/schemas/Device" } }
        runtimes: { type: array, items: { $ref: "#/components/schemas/RuntimeInstance" } }
        capabilities: { type: object, additionalProperties: true }
        labels: { type: object, additionalProperties: { type: string } }
        provenance: { $ref: "#/components/schemas/Provenance" }
    Device:
      type: object
      required: [device_id, type]
      properties:
        device_id: { type: string }
        type:
          type: string
          enum: [nvidia_gpu, amd_gpu, intel_gpu, apple_gpu, tpu, npu, cpu, other]
        vendor: { type: string }
        model: { type: string }
        memory: { $ref: "#/components/schemas/Memory" }
        telemetry: { type: object, additionalProperties: true }
        health: { type: object, additionalProperties: true }
    Memory:
      type: object
      properties:
        total: { type: number }
        weights: { type: number }
        kv_cache: { type: number }
        runtime_cache: { type: number }
        active_requests: { type: number }
        reserved: { type: number }
        other_models: { type: number }
        system: { type: number }
        unaccounted: { type: number }
        free: { type: number }
    Allocation:
      type: object
      required: [allocation_id, state]
      properties:
        allocation_id: { type: string }
        provider: { type: string }
        provider_metadata: { type: object, additionalProperties: true }
        state: { type: string }
        reason: { type: string }
        node_id: { type: string }
    RuntimeInstance:
      type: object
      required: [runtime_id, runtime_type]
      properties:
        runtime_id: { type: string }
        runtime_type: { type: string }
        selection_reason: { type: string }
        version: { type: string }
        state: { type: string }
        devices: { type: array, items: { type: string } }
        resident_models: { type: array, items: { $ref: "#/components/schemas/Residency" } }
    Model:
      type: object
      required: [model_id, type]
      properties:
        model_id: { type: string }
        type:
          type: string
          enum: [llm, embedding, reranker, vision, speech_to_text, text_to_speech, audio, image_generation, image_editing, video_generation, music_generation, prediction, multimodal, other]
        name: { type: string }
        family:
          type: string
          enum: [llm, reasoning, embeddings, reranking, stt, tts, audio, prediction, image, video, multimodal, scientific, rag]
        capabilities: { $ref: "#/components/schemas/TypedCapabilities" }
        requirements: { type: object, additionalProperties: true }
    TypedCapabilities:
      type: object
      additionalProperties: true
      properties:
        family:
          type: string
          enum: [llm, reasoning, embeddings, reranking, stt, tts, audio, prediction, image, video, multimodal, scientific, rag]
        input_modalities: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [text, image, audio, video, vector, score, numeric, label, typed] } }
        output_modalities: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [text, image, audio, video, vector, score, numeric, label, typed] } }
        quality:
          type: object
          required: [metric, value, basis]
          properties:
            metric: { type: string }
            value: { type: number }
            basis: { type: string, enum: [measured, self-reported] }
            evidence: { type: string }
        context: { type: object, nullable: true, additionalProperties: true }
        runtime_preference: { type: array, uniqueItems: true, items: { type: string } }
    Residency:
      type: object
      required: [residency_id, state]
      properties:
        residency_id: { type: string }
        model_variant_id: { type: string }
        state: { type: string }
        node_id: { type: string }
        runtime_id: { type: string }
        reason: { type: string }
    Alias:
      type: object
      required: [alias_id]
      properties:
        alias_id: { type: string }
        type: { type: string, enum: [static, dynamic] }
        constraints: { type: object, additionalProperties: true }
        targets: { type: array, items: { type: object, additionalProperties: true } }
    Capacity:
      type: object
      properties:
        requests: { type: object, additionalProperties: true }
        contexts: { type: object, additionalProperties: true }
        kv_cache: { type: object, additionalProperties: true }
        gpu_memory: { $ref: "#/components/schemas/Memory" }
        compute: { type: object, additionalProperties: true }
        slots: { type: number }
        desired: { type: object, additionalProperties: true }
        observed: { type: object, additionalProperties: true }
    Event:
      type: object
      required: [event_id, event_type, source_id, sequence, timestamp]
      properties:
        event_id: { type: string }
        event_type: { type: string }
        source_id: { type: string }
        sequence: { type: number }
        timestamp: { type: string }
        trace_id: { type: string }
        correlation_id: { type: string }
        causation_id: { type: string }
        payload: { type: object, additionalProperties: true }
    Job:
      type: object
      required: [job_id, state]
      properties:
        job_id: { type: string }
        state:
          type: string
          enum: [queued, preparing, running, finalizing, succeeded, completed, failed, cancelled, expired]
          description: New producers emit succeeded. completed is accepted only from legacy records and normalized before re-emission.
          x-canonical-emitted-value: succeeded
          x-legacy-read-values: [completed]
        family:
          type: string
          description: Additive family for runtime_families/1 jobs; absent on legacy jobs and never inferred.
          enum: [llm, reasoning, embeddings, reranking, stt, tts, audio, prediction, image, video, multimodal, scientific, rag]
        result_ref:
          $ref: "#/components/schemas/Artifact"
        progress:
          type: object
          properties:
            fraction: { type: number }
            stage: { type: string }
            message: { type: string }
        request_id: { type: string }
    Artifact:
      type: object
      required: [artifact_id]
      properties:
        artifact_id: { type: string, minLength: 1 }
        type: { type: string }
        mime_type: { type: string }
        size_bytes: { type: number, minimum: 0 }
        checksum: { type: string }
        locations: { type: array, items: { type: string } }
    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code: { type: string }
        category:
          type: string
          enum: [protocol, authentication, authorization, routing, model, capacity, runtime, hardware, allocation, artifact, timeout, cancellation, upstream, internal]
        message: { type: string }
        retryable: { type: boolean }
        retry_after_ms: { type: number }
        request_id: { type: string }
        trace_id: { type: string }
        details: { type: object, additionalProperties: true }
        fallbacks: { type: array, items: { type: object, additionalProperties: true } }
    GpuMemoryFleet:
      type: object
      description: Summary; authoritative schema schemas/v1/resources/gpu-memory-fleet.json.
      required: [schema, gatewayId, producerEpoch, sequence, generatedAt, authority, nodes]
      properties:
        schema: { type: string, enum: [iw.gpu-memory.fleet/1] }
        gatewayId: { type: string }
        producerEpoch: { type: string }
        sequence: { type: integer }
        generatedAt: { type: string }
        authority: { type: object, additionalProperties: true }
        nodes: { type: array, items: { type: object, additionalProperties: true } }
        nodeCount: { type: integer }
        servedAgeMs: { type: integer, minimum: 0 }
        nextCursor: { type: string }
        reservations: { type: array, items: { type: object, additionalProperties: true } }
        peers: { type: array, items: { type: object, additionalProperties: true } }
    GpuMemoryEvent:
      type: object
      description: Summary; authoritative schema schemas/v1/events/gpu-memory-event.json.
      required: [eventId, cursor, type, occurredAt, gatewayId, payload]
      properties:
        eventId: { type: string }
        cursor: { type: string }
        type: { type: string }
        occurredAt: { type: string }
        gatewayId: { type: string }
        correlationId: { type: string }
        payload: { type: object, additionalProperties: true }
    PlacementSimulationRequest:
      type: object
      description: Summary; authoritative schema schemas/v1/resources/placement-simulation-request.json.
      required: [modelId, requirements]
      properties:
        modelId: { type: string }
        placementClass: { type: string }
        requirements: { type: object, additionalProperties: true }
        scope: { type: object, additionalProperties: true }
    PlacementSimulationResponse:
      type: object
      description: Summary; authoritative schema schemas/v1/resources/placement-simulation-response.json.
      required: [simulationId, basedOn, mode, reservationsMade, candidates]
      properties:
        simulationId: { type: string }
        basedOn: { type: object, additionalProperties: true }
        mode: { type: string, enum: [read-only] }
        reservationsMade: { type: integer, enum: [0] }
        candidates: { type: array, items: { type: object, additionalProperties: true } }
        reasoning: { type: string }
