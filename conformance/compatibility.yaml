# InferWeave Protocol v1 compatibility matrix
# Machine-readable minimum implementation versions per protocol version. See specs/45_PROTOCOL_V1.md.
# The inferweave reference implementation and the gateway consumer do not yet exist as
# conforming Protocol v1 components; their minimums are recorded as `unknown` and must be
# filled when a conforming release ships (task P5-T29).
protocol: 1.1.0
implementations:
  inferweave:
    minimum: unknown
  gateway:
    minimum: unknown
runtimeProtocol:
  introduced: 1.1.0
  legacyPeerPolicy: omit-additive-fields
  features:
    runtime_families: "1"
    runtime_lifecycle: "1"
    runtime_reservations: "1"
    transactional_caches: "1"
    native_link_requests: "1"
  rules:
    - A peer that does not advertise a feature is handled through the pre-feature Protocol v1 shape.
    - Unknown feature names are ignored and preserved according to specs/45.
    - New producers emit succeeded; readers accept legacy completed and normalize it before re-emission.
    - Job family is absent on legacy records and must never be inferred from a model name.
    - A legacy Link Hello omits all native_link fields, receives no hello_ack and remains eligible only for legacy metadata-free dispatch.
    - Native link dispatch requires iw.link-native-request/1 on the current registration plus a bound v1 Hello/ack for the exact registration_connection_id and link_incarnation_id.
    - Re-registration, replacement, withdrawal, staleness or credential expiry revokes the old native binding before another native frame can be enqueued.
