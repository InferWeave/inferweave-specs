# InferWeave Protocol v1 compatibility matrix
# Machine-readable minimum implementation versions per protocol version. See specs/45_PROTOCOL_V1.md.
# The inferweave reference implementation and the gateway consumer do not yet exist as
# conforming Protocol v1 components; their minimums are recorded as `unknown` and must be
# filled when a conforming release ships (task P5-T29).
protocol: 1.1.0
implementations:
  inferweave:
    minimum: unknown
  gateway:
    minimum: unknown
runtimeProtocol:
  introduced: 1.1.0
  legacyPeerPolicy: omit-additive-fields
  features:
    runtime_families: "1"
    runtime_lifecycle: "1"
    runtime_reservations: "1"
    transactional_caches: "1"
    native_link_requests: "1"
    native_link_responses: "1"
  rules:
    - A peer that does not advertise a feature is handled through the pre-feature Protocol v1 shape.
    - Unknown feature names are ignored and preserved according to specs/45.
    - New producers emit succeeded; readers accept legacy completed and normalize it before re-emission.
    - Job family is absent on legacy records and must never be inferred from a model name.
    - A legacy Link Hello omits all native_link fields, receives no hello_ack and remains eligible only for legacy metadata-free dispatch.
    - A legacy /v1/node/register request omits capabilities, still registers, and negotiates no native Link capability; capabilities is an array offer/response intersection, not the generic features map.
    - Native link dispatch requires iw.link-native-request/1 on the current registration plus a bound v1 Hello/ack for the exact registration_connection_id and link_incarnation_id.
    - Native Link HTTP relay requires iw.link-native-response/1 on that same binding and validates end-frame status/header/body proof before emitting bytes; request-only peers remain valid but are ineligible for this relay mode.
    - A missing or invalid response proof fails closed; response JSON fields never determine HTTP status.
    - Re-registration, replacement, withdrawal, staleness, credential expiry or socket close revokes the old native binding before another native frame can be enqueued.

dynamicAliases:
  introduced: 1.1.0
  feature: dynamic_aliases
  offeredLevel: "2"
  httpSelection: "InferWeave-Alias-Level: 2"
  legacyLevel: "1"
  legacySchema: schemas/v1/model/alias.json
  level2Schema: schemas/v1/aliases/contract.json
  implementationMinimum: unknown
  rules:
    - Absent header preserves the existing GET /aliases array and exact inference behavior.
    - Unsupported explicit levels fail UNSUPPORTED_ALIAS_LEVEL; no silent policy downgrade.
    - Level 2 offer includes level 1 support; absence means new operations cannot be used.
    - Policies not representable at level 1 must not be advertised as weaker level 1 hints.
    - Unknown write policy fields fail validation; tenant identity never comes from body claims.
