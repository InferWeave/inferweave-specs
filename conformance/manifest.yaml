# InferWeave Protocol v1 conformance manifest
# Declares conformance profiles and the scenarios each must pass. Scenario names match
# specs/45_PROTOCOL_V1.md ("Conformance levels"). See also conformance/scenarios/.
protocol: 1.1.0
scenarios:
  schema_validation
  protocol_discovery
  feature_negotiation
  registration
  heartbeat
  topology
  events
  retries
  errors
  aliases
  federation
  capability_advertisement
  snapshot_consistency
  backwards_compatibility
  gpu_memory_accounting
  node_enrollment
  hardware_registration
profiles:
  IW-DATA:
    required_scenarios: [schema_validation, protocol_discovery, feature_negotiation]
  IW-NODE:
    required_scenarios: [registration, heartbeat, topology, capability_advertisement]
  IW-GATEWAY:
    required_scenarios: [registration, heartbeat, topology, capability_advertisement, retries, errors, aliases, node_enrollment, hardware_registration]
  IW-FEDERATION:
    required_scenarios: [federation, snapshot_consistency, events]
  IW-OBSERVABILITY:
    required_scenarios: [events, snapshot_consistency, topology]
  IW-ADMIN:
    required_scenarios: [protocol_discovery, registration, heartbeat]
  IW-GPU-MEMORY:
    required_scenarios: [schema_validation, feature_negotiation, capability_advertisement, gpu_memory_accounting]
  IW-FULL:
    required_scenarios: [schema_validation, protocol_discovery, feature_negotiation, registration, heartbeat, topology, events, retries, errors, aliases, federation, capability_advertisement, snapshot_consistency, backwards_compatibility, node_enrollment, hardware_registration]

negotiated_profiles:
  IW-DYNAMIC-ALIASES-2:
    feature: dynamic_aliases
    level: "2"
    artifact_runner: tests/smoke/test_dynamic_alias_contract.py
    implementation_acceptance: contracts/dynamic-alias-acceptance.json
    proof_status: owed
    required_scenarios: [aliases, schema_validation, feature_negotiation, errors, retries, federation, events, snapshot_consistency, backwards_compatibility]

  IW-ALIAS-EXECUTION-IDENTITY-1:
    feature: dynamic_aliases
    level: "2"
    artifact_runner: tests/smoke/test_alias_execution_contract.py
    implementation_acceptance: contracts/dynamic-alias-acceptance.json
    proof_status: owed
    required_scenarios: [aliases, schema_validation, retries, errors, federation, backwards_compatibility]
